# Netlify: static pages from /public, API from netlify/functions/api.js
# These settings override anything set in the Netlify UI (e.g. a stray "hugo" build command).

[build]
  publish = "public"
  command = "echo 'No build step needed'"

[functions]
  node_bundler = "esbuild"

# Pretty URLs for the pages
[[redirects]]
  from = "/book"
  to = "/book.html"
  status = 200

[[redirects]]
  from = "/status"
  to = "/status.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex"
